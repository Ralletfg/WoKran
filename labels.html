<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR-Etiketten</title>
  <link rel="stylesheet" href="style.css?v=20261027b">
  <link rel="stylesheet" href="labels.css?v=20261027b">
</head>
<body class="page">
  <header class="bar no-print">
    <h1>QR-Etiketten</h1>
    <a href="./" class="badge">Zur Karte</a>
  </header>

  <!-- Übersicht: Kacheln nach Fahrzeugtyp, darunter Fahrzeuge anlegen -->
  <main id="overview" class="content no-print">
    <div class="card">
      <h2>Fahrzeugtypen</h2>
      <div id="tiles" class="tiles"></div>
    </div>

    <form id="add-form" class="card">
      <h2>Fahrzeug anlegen</h2>
      <label>Kostenträger <input name="name" required placeholder="z. B. 4711"></label>
      <button type="submit" class="primary">Hinzufügen</button>
    </form>

    <div class="card">
      <h2>Mehrere auf einmal</h2>
      <p class="muted">Ein Kostenträger pro Zeile (zum Beispiel eine Spalte aus Excel kopiert).</p>
      <textarea id="bulk" rows="5" placeholder="4711&#10;4712"></textarea>
      <button id="bulk-add" type="button">Alle hinzufügen</button>
    </div>
  </main>

  <!-- Ansicht eines Typs: seine QR-Etiketten -->
  <section id="group" hidden>
    <div class="content no-print group-head">
      <button id="back" type="button">← Fahrzeugtypen</button>
      <h2 id="group-title"></h2>
      <button id="print" type="button" class="primary">Etiketten drucken</button>
      <p class="muted">Druckt diese Fahrzeuge auf A4, drei Etiketten pro Zeile. Ein Scan mit der normalen Handy-Kamera öffnet direkt die App.</p>
    </div>
    <div id="sheet" class="sheet"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js?v=20261027b"></script>
  <script src="store.js?v=20261027b"></script>
  <script src="auth.js?v=20261027b"></script>
  <script src="labels.js?v=20261027b"></script>
</body>
</html>
