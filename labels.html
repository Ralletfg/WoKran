<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR-Etiketten</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="labels.css">
</head>
<body class="page">
  <header class="bar no-print">
    <h1>QR-Etiketten</h1>
    <a href="./" class="badge">Zur Karte</a>
  </header>

  <main class="content no-print">
    <form id="add-form" class="card">
      <h2>Fahrzeug anlegen</h2>
      <label>Name oder Nummer <input name="name" required placeholder="z. B. Kran 12"></label>
      <label>Kennzeichen <input name="plate" placeholder="z. B. LAU-AB 123"></label>
      <button type="submit" class="primary">Hinzufügen</button>
    </form>

    <div class="card">
      <h2>Mehrere auf einmal</h2>
      <p class="muted">Eine Zeile pro Fahrzeug: Name; Kennzeichen (zum Beispiel aus Excel kopiert).</p>
      <textarea id="bulk" rows="5" placeholder="Kran 12; LAU-AB 123&#10;Stapler 3"></textarea>
      <button id="bulk-add" type="button">Alle hinzufügen</button>
    </div>

    <div class="card">
      <h2>Fahrzeuge <span id="count" class="muted"></span></h2>
      <button id="print" type="button" class="primary">Etiketten drucken</button>
      <p class="muted">Druckt alle Fahrzeuge auf A4, drei Etiketten pro Zeile. Ein Scan mit der normalen Handy-Kamera öffnet direkt die App.</p>
    </div>
  </main>

  <section id="sheet" class="sheet"></section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="labels.js"></script>
</body>
</html>
