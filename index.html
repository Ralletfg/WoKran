<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fahrzeug-Standorte</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=20261027c">
</head>
<body>
  <header class="bar">
    <h1>Fahrzeuge</h1>
    <span class="bar-right">
      <span id="mode" class="badge"></span>
      <button id="user" type="button" class="badge" hidden></button>
      <a id="admin-link" href="admin.html" class="badge" hidden>Admin</a>
      <a href="labels.html" class="badge">QR-Etiketten</a>
    </span>
  </header>

  <div class="search">
    <input id="search" type="search" placeholder="Kostenträger suchen" autocomplete="off">
    <ul id="search-results" hidden></ul>
  </div>

  <div id="map"></div>

  <div id="scanner" class="overlay" hidden>
    <video id="scan-video" playsinline muted></video>
    <div class="scan-frame"></div>
    <p class="scan-text">QR-Code am Fahrzeug in den Rahmen halten</p>
    <button id="scan-close" type="button">Abbrechen</button>
  </div>

  <div id="capture" class="hint" hidden>
    <strong id="capture-title"></strong>
    <div id="capture-status" class="muted"></div>
    <div class="hint-actions">
      <button id="capture-gps" type="button">GPS neu holen</button>
      <button id="capture-cancel" type="button">Abbrechen</button>
      <button id="capture-save" type="button" class="primary">Standort speichern</button>
    </div>
  </div>

  <div id="panel" class="hint" hidden>
    <div class="panel-head">
      <strong id="panel-title"></strong>
      <button id="panel-close" type="button" class="close" aria-label="Schließen">×</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <nav class="actions">
    <button id="btn-scan" type="button" class="primary">Scannen</button>
    <button id="btn-locate" type="button">Standort</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="config.js?v=20261027c"></script>
  <script src="store.js?v=20261027c"></script>
  <script src="scan.js?v=20261027c"></script>
  <script src="auth.js?v=20261027c"></script>
  <script src="app.js?v=20261027c"></script>
</body>
</html>
